
[raspberry-gpio]
enabled = true
bcm5 = play_pause,active_low,100
bcm6 = volume_down,active_low,100
bcm16 = next,active_low,100
bcm20 = volume_up,active_low,100
bcm24 = volume_up,active_low,100

[file]
enabled = true
media_dirs = ~/Music
show_dotfiles = false
excluded_file_extensions =
  .directory
  .html
  .jpeg
  .jpg
  .log
  .nfo
  .pdf
  .png
  .txt
  .zip
follow_symlinks = false
metadata_timeout = 1000

[local]
media_dir = ~/Music

[pidi]
enabled = true
display = st7789
# rotated an additional 180 degrees from pimoroni's standard to be more ergonomic
rotation = 270

[mpd]
hostname = 0.0.0.0

[http]
hostname = 0.0.0.0

[audio]
mixer_volume = 40

