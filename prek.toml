minimum_prek_version = "0.4.11"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
fail_fast = true

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1000"]

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "debug-statements"

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.49.0"

[[repos.hooks]]
id = "typos"
args = ["--force-exclude"]

[[repos.hooks]]
id = "typos"
name = "Spell check commit message"
args = ["--force-exclude"]
stages = ["commit-msg"]


[[repos.hooks]]
id = "typos"
name = "Spell check commit contents"
stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.49.1"

[[repos.hooks]]
id = "markdownlint-fix"
args = ["--disable", "MD013"]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v4.0.0-alpha.8"

[[repos.hooks]]
id = "prettier"
types_or = ["toml", "yaml"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.4"

[[repos.hooks]]
id = "ruff"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v2.3.1"

[[repos.hooks]]
id = "mypy"
args = ["--ignore-missing-imports"]
additional_dependencies = ["types-requests"]

